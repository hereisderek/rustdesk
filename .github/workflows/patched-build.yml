name: Build patched fork artifacts only (no sync, no tag, no release)

# Manual force-build of the existing patched tree using the same build jobs as patched-release.yml.
# Builds whatever `ref` points at (default: the `<version>-patched` tag made by patched-release.yml) and uploads artifacts to the workflow run only.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (blank = <version>-patched tag)"
        required: false
        type: string
      version:
        description: "Version used in artifact names (blank = latest upstream release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve ref and version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(gh api repos/rustdesk/rustdesk/releases/latest --jq .tag_name)"
            version="${version#v}"
          fi
          ref="${INPUT_REF:-${version}-patched}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building ref=$ref version=$version" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    uses: ./.github/workflows/flutter-build-patched.yml
    secrets: inherit
    with:
      checkout-ref: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.version }}
      upload-artifact: true
      publish-release: false
